# Installed by Linha Produtiva. Contains no secrets: credentials come from the relay, authenticated via OIDC.
# The file name (.github/workflows/linha.yml) is part of the relay's verification; do not rename it.
name: linha
run-name: ${{ github.event.action || inputs.phase }} · ${{ github.event.client_payload.ticket || inputs.ticket }}

on:
  repository_dispatch:
    types: [linha.analysis, linha.development, linha.review]
  workflow_dispatch:
    inputs:
      phase:
        description: Fase
        type: choice
        options: [analysis, development, review]
      ticket:
        description: 'Chave do ticket (ex.: ART-1)'
        required: true

permissions:
  id-token: write # OIDC token for the relay
  contents: read

concurrency:
  # Development: one at a time per repo (Claude quota). Other phases: one per ticket and phase.
  group: ${{ (github.event.action == 'linha.development' || inputs.phase == 'development') && 'linha-coder' || format('linha-{0}-{1}', github.event.action || inputs.phase, github.event.client_payload.ticket || inputs.ticket) }}
  cancel-in-progress: false

jobs:
  linha:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: gabrielzv11/linha-produtiva@v1
        with:
          relay: https://linha-produtiva.vercel.app
