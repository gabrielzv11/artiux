# Installed by Linha Produtiva. Contains no secrets: credentials come from the relay, authenticated via OIDC.
# The pipeline code itself is downloaded from the relay on every run (always the deployed version) and checked by sha256.
# The file name (.github/workflows/linha.yml) is part of the relay's verification; do not rename it.
name: linha
run-name: ${{ github.event.action || inputs.phase }} · ${{ github.event.client_payload.ticket || inputs.ticket }}

on:
  repository_dispatch:
    types: [linha.analysis, linha.development, linha.review]
  workflow_dispatch:
    inputs:
      phase:
        description: Fase
        type: choice
        options: [analysis, development, review]
      ticket:
        description: 'Chave do ticket (ex.: ART-1)'
        required: true

permissions:
  id-token: write # OIDC token for the relay
  contents: read

concurrency:
  # Development: one at a time per repo (Claude quota). Other phases: one per ticket and phase.
  group: ${{ (github.event.action == 'linha.development' || inputs.phase == 'development') && 'linha-coder' || format('linha-{0}-{1}', github.event.action || inputs.phase, github.event.client_payload.ticket || inputs.ticket) }}
  cancel-in-progress: false

jobs:
  linha:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Baixar a linha
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 "https://linha-produtiva.vercel.app/linha.mjs" -o linha.mjs
          curl -fsSL --retry 3 "https://linha-produtiva.vercel.app/linha.mjs.sha256" -o linha.mjs.sha256
          sha256sum -c linha.mjs.sha256
      - name: Linha
        env:
          INPUT_RELAY: https://linha-produtiva.vercel.app
        run: node "${{ runner.temp }}/linha.mjs"
